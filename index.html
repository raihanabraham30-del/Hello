<!DOCTYPE html>
<html>
<head>
    <title>Lab Defacement Raihan</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; transition: 0.5s; }
        .container { border: 2px solid #333; padding: 20px; border-radius: 15px; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>

    <div class="container" id="box">
        <h1 id="judul">Selamat Datang di Web Saya</h1>
        <p id="deskripsi">Silakan masukkan nama kamu di bawah ini:</p>
        
        <input type="text" id="userInput" placeholder="Tulis sesuatu...">
        <br>
        <button onclick="proses()">Kirim Data</button>
    </div>

    <script>
        function proses() {
            let data = document.getElementById('userInput').value;
            
            // TITIK KERENTANAN: Menggunakan innerHTML
            // Ini akan membuat browser menjalankan apa pun yang diketik user sebagai kode HTML/JS
            document.getElementById('deskripsi').innerHTML = "Halo, " + data;
        }
    </script>
</body>
</html>
